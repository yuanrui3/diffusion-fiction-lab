[project]
name = "dfl"
version = "0.1.0"
description = "Diffusion fiction lab: reusable loading, generation and checking code"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Dream's README asks for exactly these two versions.
    "torch==2.5.1",
    "transformers==4.46.2",
    "accelerate>=1.1,<1.3",
    "bitsandbytes>=0.44",
    "safetensors",
    "huggingface_hub>=0.26,<1",
    "sentence-transformers>=3.3,<4",
    "pypinyin>=0.53",
    "jieba>=0.42.1",
    "opencc-python-reimplemented>=0.1.7",
    "numpy<2.2",
    "pytest>=8",
    "ltp>=4.2.14",
    "stanza>=1.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfl"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
